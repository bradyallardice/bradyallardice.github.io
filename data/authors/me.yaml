bio: |
  I am a PhD candidate in Political and Social Sciences at Universitat Pompeu Fabra
  and the Institut Barcelona d’Estudis Internacionals (IBEI), supervised by Aina
  Gallego, and an FI (Joan Oró) predoctoral fellow of the Generalitat de Catalunya.

  My research studies the political economy of technological change: how automation
  and artificial intelligence reshape work, and when those shocks do or do not
  translate into voting, beliefs, and policy. I combine causal inference designs with
  computational methods, including LLM-based text classification with human
  validation and large-scale embedding pipelines.

  In 2026 I was a visiting researcher at the University of Southern California, and
  I am a member of the OpenAI Economic Research Exchange research team. I will next
  spend three months as a visiting researcher at Bocconi University, hosted by Piero
  Stanig. Before the
  PhD, I worked as a data scientist at Paysafe and as a research associate at UC
  Riverside’s Center for Economic Forecasting and Development.

